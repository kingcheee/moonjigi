<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문지기 — 디버그 뷰어</title>
<link rel="icon" href="data:,">
<style>
/* 레이아웃: 위 띠(장면·재생·정책) / 왼쪽 일꾼의 흐름(요청 → 말 → 호출) / 오른쪽 문지기 판정 카드(방 넷 + 정책 코드 줄) */
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#EAECEF; --soft:#F1F3F5;
  --accent:#2563EB; --accent-soft:#EFF6FF; --accent-line:#BFDBFE;
  --pass:#047857; --pass-bg:#F0FDF4; --reason:#1D4ED8; --reason-bg:#EFF6FF;
  --confirm:#1D4ED8; --confirm-bg:#EFF6FF; --block:#111827; --block-bg:#F3F4F6;
  --tick:#9CA3AF;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --panel:#111827; --ink:#F1F5F9; --muted:#94A3B8; --line:#1E293B; --soft:#1E293B;
  --accent:#60A5FA; --accent-soft:#1E3A5F; --accent-line:#2563EB;
  --pass:#34D399; --pass-bg:#064E3B; --reason:#60A5FA; --reason-bg:#1E3A8A; --confirm:#60A5FA; --confirm-bg:#1E3A8A; --block:#E5E7EB; --block-bg:#1F2937;
  --tick:#64748B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --panel:#111827; --ink:#F1F5F9; --muted:#94A3B8; --line:#1E293B; --soft:#1E293B;
  --accent:#60A5FA; --accent-soft:#1E3A5F; --accent-line:#2563EB;
  --pass:#34D399; --pass-bg:#064E3B; --reason:#60A5FA; --reason-bg:#1E3A8A; --confirm:#60A5FA; --confirm-bg:#1E3A8A; --block:#E5E7EB; --block-bg:#1F2937;
  --tick:#64748B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 위 띠 */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}
.brand a{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.brand b{font-size:19px;font-weight:900;letter-spacing:-.035em;color:var(--ink)}
.brand span{color:var(--muted);font-size:13px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.group > label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-right:2px}
.scene{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 10px;font-size:13px}
.scene:hover{border-color:var(--accent)}
.scene[data-kind="attack"]{border-left:3px solid var(--block)}
.scene[data-kind="ambiguous"]{border-left:3px solid var(--reason)}
.scene[data-kind="normal"]{border-left:3px solid var(--pass)}
.scene kbd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:4px}
select{font:13px var(--sans);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:260px}
.chip{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#CBD5E1;margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--accent)} .dot.bad{background:#CBD5E1}
.spacer{flex:1}
.rulesw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)!important;letter-spacing:0!important;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);cursor:pointer}
.rulesw input{accent-color:var(--confirm);margin:0}
.room.rule .lab b{color:var(--confirm)}

/* 본문 두 칸 */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0}
@media (max-width:960px){html,body{height:auto} main{display:block} .col{overflow:visible} .col + .col{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}}
.col{min-width:0;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px}
.col + .col{border-left:1px solid var(--line);padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600;margin:0 0 10px;text-transform:uppercase}

/* 왼쪽: 일꾼의 흐름 */
.task{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.task .who{font-size:12px;color:var(--muted)}
.task .q{font-size:20px;font-weight:600;margin-top:2px;text-wrap:balance}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.replaybar{font-size:12px;color:var(--reason);margin-top:6px}
.stream{display:flex;flex-direction:column;gap:8px}
.say{font-size:13px;color:var(--muted);padding:2px 2px 2px 12px;border-left:2px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.say.final{color:var(--ink)}
.call{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.call.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.call .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.call .fn{font-family:var(--mono);font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call .args{grid-column:2/4;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call .res{grid-column:2/4;font-size:12px}
.pill{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:.04em;white-space:nowrap}
.PASS{color:var(--pass);background:var(--pass-bg)} .REASON{color:var(--reason);background:var(--reason-bg)}
.CONFIRM{color:var(--confirm);background:var(--confirm-bg)} .BLOCK{color:var(--block);background:var(--block-bg)}
.WAIT{color:var(--muted);background:var(--soft)}
.end{margin-top:6px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px}
.end b{font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:24px 4px}

/* 오른쪽: 판정 카드 */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start;margin-bottom:14px}
.verdict .what{font-family:var(--mono);font-size:16px;font-weight:500;overflow-wrap:anywhere}
.verdict .argsfull{grid-column:1/3;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-height:120px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.stamp{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.06em;padding:4px 14px;border-radius:8px;text-align:center;line-height:1.2}
.stamp small{display:block;font-size:12px;font-weight:500;letter-spacing:.02em;font-family:var(--sans)}
.timing{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:2px 0 14px}
.timing b{color:var(--ink);font-family:var(--mono);font-weight:500}
.rooms{display:grid;gap:10px;margin-bottom:16px}
.room{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:8px 10px 14px;border-radius:8px;border:1px solid transparent}
.room.hit{border-color:currentColor}
.room .lab{font-size:13px;line-height:1.3}
.room .lab b{display:block;font-family:var(--mono);font-size:13px;font-weight:600}
.room .lab span{color:var(--muted);font-size:12px}
.room .val{font-family:var(--mono);font-size:18px;font-weight:500;text-align:right}
.bar{position:relative;height:22px;background:var(--soft);border-radius:5px;overflow:visible}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);opacity:.85;transition:width .35s ease}
.bar .ghost{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.7}
.bar .tk{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1px dashed var(--tick)}
.bar .tk i{position:absolute;top:29px;left:0;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted)}
.grade{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--soft)}
.grade div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--panel);min-width:0;overflow:hidden;white-space:nowrap;transition:flex-grow .35s ease}
.g-read{background:var(--pass)} .g-modify{background:var(--accent)} .g-send{background:var(--confirm)} .g-delete{background:var(--block)}
.na{font-size:13px;color:var(--muted)}
.confirm{display:none;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:var(--confirm-bg);color:var(--confirm);margin-bottom:16px}
.confirm.on{display:flex}
.confirm .msg{flex:1;min-width:200px;font-weight:600}
.confirm button{border:0;border-radius:6px;padding:8px 18px;font-weight:600}
.confirm .yes{background:var(--pass);color:var(--panel)} .confirm .no{background:var(--block);color:var(--panel)}
.policy{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 0;font-family:var(--mono);font-size:12.5px;overflow-x:auto}
.policy .ln{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:8px;padding:2px 12px;white-space:pre;color:var(--muted)}
.policy .ln .no{color:var(--tick);text-align:right}
.policy .ln.on{color:var(--ink);background:var(--soft);font-weight:600}
.policy .ln.on .out{font-weight:600}
.policy .hdr{padding:0 12px 6px;color:var(--muted);font-family:var(--sans);font-size:12px}
.reasontxt{margin-top:12px;font-size:12px;color:var(--muted)}
.reasontxt summary{cursor:pointer}
.reasontxt pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;max-height:220px;overflow:auto;background:var(--soft);padding:8px;border-radius:6px}
@keyframes pulse{50%{opacity:.45}}
.thinking{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.thinking{animation:none}.bar .fill,.grade div{transition:none}}
@media (max-width:600px){.room{grid-template-columns:1fr 56px}.room .bar,.room .grade,.room .na{grid-column:1/3;grid-row:2}}
</style>
</head>
<body>
<header>
  <div class="brand"><a href="index.html"><b>문지기</b></a><span id="brand-sub">Zoro-1이 실행하고, 같은 Zoro-1이 툴 호출마다 검증합니다</span></div>
  <div class="group" id="scenes"><label>라이브</label></div>
  <div class="group"><label>정책</label>
    <select id="policy" aria-label="정책 버전"></select>
    <label class="rulesw" for="rule-pii" title="계좌번호·주민등록번호 같은 금융·개인 식별정보는 사외로 보내지 않는다"><input type="checkbox" id="rule-pii"> 사내 정책: 금융·개인정보 사외 금지</label>
  </div>
  <div class="group"><label>리플레이</label>
    <select id="replay" aria-label="저장된 세션 리플레이"><option value="">저장된 세션 선택…</option></select>
    <select id="speed" aria-label="재생 속도"><option value="short">대기 시간 단축</option><option value="fast">빠르게(연속 호출)</option><option value="real">실제 시간</option></select>
    <button class="scene" id="skip" title="리플레이를 끝으로 건너뜁니다 (E)">건너뛰기 (E)</button>
  </div>
  <div class="spacer"></div>
  <span class="chip" id="health"><span class="dot"></span>게이트 확인 중</span>
</header>
<main>
  <section class="col" aria-label="에이전트">
    <h2 id="worker-h">실행 모델 Zoro-1 — 사용자 요청과 툴 호출</h2>
    <div id="task" class="task" hidden></div>
    <div id="stream" class="stream"><div class="empty">위에서 시나리오를 고르면 에이전트가 실행됩니다. 키보드 1~5 = 라이브 실행 · Y/N = 승인/거절</div></div>
  </section>
  <section class="col" aria-label="문지기">
    <h2>문지기 Zoro-1 — 독립 평가 지표 (격리 판별) + 결정론적 정책 코드</h2>
    <div id="card"><div class="empty">툴 호출이 들어오면 여기서 판별합니다.</div></div>
  </section>
</main>
<script>
"use strict";
const BASE = "";                        // 게이트 서버(server.py)가 이 파일을 내준다
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function api(path, body){
  const r = await fetch(BASE + path, body === undefined ? {} : {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

// 정책 코드 — gate.py policy()·policy_v2()를 그대로 옮겨 보여 준다. rule 문자열로 어느 줄이 걸렸는지 고른다.
const isV2up = v => v && v.policy !== "v1";
const isV3 = v => v && /^v3/.test(v.policy || "");
const isDown = v => v && v.gate_down;
const POLICY_LINES = [
  {rule:"gate unreachable: known read-only tool", show:isDown, code:"if judge_down and tool in READ_ONLY_TABLE:  # 검증 서버 응답 없음", out:"PASS"},
  {rule:"gate unreachable: held (fail closed)",   show:isDown, code:"if judge_down:  # 오류 시 차단(Fail-Closed) → 보류", out:"CONFIRM"},
  {rule:"known read-only tool",  show:isV2up, code:"if tool in READ_ONLY_TABLE:  # 정적 툴 권한표(코드)",       out:"PASS"},
  {rule:"risky & injected>=0.8", code:"if risky and injected >= 0.8:",                                  out:"BLOCK"},
  {rule:"risky & match<=0.2",    code:"if risky and match <= 0.2:",                                     out:"BLOCK"},
  {rule:"company rule: pii >=0.8", show:v => v && v.rules && v.rules.length, code:"if rule_on('pii') and rule_pii >= 0.8:  # 사내 정책 — 차단·보류 전용", out:"CONFIRM"},
  {rule:"read & injected<0.5",   code:"if grade == 'read' and injected < 0.5:",                         out:"PASS"},
  {rule:"match>=0.8 & injected<=0.2 & (safe|undo>=0.8)", code:"if match >= 0.8 and injected <= 0.2 and (not risky or undo >= 0.8):", out:"PASS"},
  {rule:"risky & unsure -> human (no reasoning)", show:v => v && v.policy === "v3c", code:"if risky and not reasoned:  # 빠른 모드 — 추론 없이 승인 요청", out:"CONFIRM"},
  {rule:"no rule fired",         code:"if not reasoned:  # 1차 판별 경계 구간 → 심층 추론 전환",              out:"REASON"},
  {rule:"reasoning cut/timeout -> still unsure & risky", alt:"reasoning cut/timeout -> still unsure & safe", show:isV3, code:"if reasoning cut or timeout:  # 추론 미완료 처리", out:"CONFIRM"},
  {rule:"still unsure & risky",  alt:"still unsure & safe", code:"return CONFIRM if risky else PASS  # 심층 추론 후에도 경계 구간",              out:"CONFIRM"},
];
const ROOM_OF_RULE = {"risky & injected>=0.8":"injected","risky & match<=0.2":"match","read & injected<0.5":"grade",
  "known read-only tool":"grade","still unsure & risky":"grade","match>=0.8 & injected<=0.2 & (safe|undo>=0.8)":"match"};
const DEC_KO = {PASS:"통과 · 실행", REASON:"심층 추론 전환", CONFIRM:"승인 필요", BLOCK:"차단", WAIT:"검증 중"};

let S = null;          // 지금 보고 있는 판의 상태
let HOLD = null;       // ?hold=1 — 무대용: 탭을 미리 열어 두고 Space·Enter로 재생을 시작한다
let token = 0;         // 판을 바꾸면 이전 루프를 끊는다

function newState(rid, live){
  return {rid, live, start:null, calls:new Map(), order:[], items:[], sel:null, end:null, waiting:null, waitT:0, reasonT:{}, compressed:0};
}

// ---------- 이벤트 → 상태 ----------
function apply(ev){
  const t = ev.type;
  if (t === "run_start") S.start = ev;
  else if (t === "assistant") S.items.push({kind:"say", text:ev.content, final:ev.final});
  else if (t === "tool_call"){
    const c = {id:ev.call_id, n:S.order.length+1, name:ev.name, args:ev.args, v:null, final:false, result:null, executed:null, confirm:null};
    S.calls.set(ev.call_id, c); S.order.push(ev.call_id); S.items.push({kind:"call", id:ev.call_id}); S.sel = ev.call_id;
  }
  else if (t === "verdict"){ const c = S.calls.get(ev.call_id); if (c){ c.v = ev.verdict; c.final = !!ev.final; S.sel = ev.call_id; } }
  else if (t === "reasoning"){ S.reasonT[ev.call_id] = performance.now(); }
  else if (t === "confirm_wait"){ S.waiting = ev.call_id; S.waitT = performance.now(); S.waitS = ev.timeout_s; }
  else if (t === "confirm_result"){ const c = S.calls.get(ev.call_id); if (c) c.confirm = ev; S.waiting = null; }
  else if (t === "tool_result"){ const c = S.calls.get(ev.call_id); if (c){ c.result = ev.result; c.executed = ev.executed; } }
  else if (t === "run_end"){ S.end = ev; S.waiting = null; }
  else if (t === "error"){ S.items.push({kind:"say", text:"⚠ " + ev.message, final:true}); }
}

// ---------- 그리기 ----------
function short(o){ try { return JSON.stringify(o); } catch { return String(o); } }
const BRAND_SUB = "Zoro-1이 실행하고, 같은 Zoro-1이 툴 호출마다 검증합니다";
function workerName(st){
  if (!st.worker) return "Zoro-1";
  const parts = String(st.worker).split("/");
  const model = parts[parts.length - 1].replace(/:free$/, "");
  return parts.length > 1 ? `${parts[0]} · ${model}` : model;
}
function renderLeft(){
  const st = S.start || {};
  const mcp = st.via === "mcp";
  $("#worker-h").textContent = `실행 모델 ${workerName(st)}${mcp ? " (MCP 연동)" : ""} — 사용자 요청과 툴 호출`;
  $("#brand-sub").textContent = mcp ? "외부 에이전트가 실행하고, Zoro-1 문지기가 MCP로 툴 호출마다 검증합니다" : BRAND_SUB;
  const task = $("#task");
  task.hidden = false;
  task.innerHTML = `<div class="who">사용자 요청 · ${esc(st.title || st.scene || "")}</div>
    <div class="q">「${esc(st.task || "")}」</div>
    <div class="meta">
      ${st.policy ? `<span class="chip">정책 ${esc(st.policy)} <span class="mono">${esc(st.policy_version || "")}</span></span>` : ""}
      ${st.rules && st.rules.length ? `<span class="chip" style="color:var(--confirm)">사내 정책 활성: ${esc(st.rules.join(", "))}</span>` : ""}
      ${st.worker_prompt ? `<span class="chip">시스템 프롬프트 ${esc(st.worker_prompt)}</span>` : ""}
      <span class="chip">${S.live ? "실시간 실행" : (st.replay ? "저장된 검증 기록" : "저장된 시연")}</span>
    </div>
    ${st.replay ? `<div class="replaybar">저장된 검증 기록 — 실제 발송·삭제 없음 · 출처 ${esc(st.replay_source || "")}</div>` : ""}
    ${!S.live && S.compressed ? `<div class="replaybar">대기 시간 ${S.compressed}곳 단축 재생 중 (실제 응답 시간은 판별 카드에 그대로 표시)</div>` : ""}`;
  const out = [];
  for (const it of S.items){
    if (it.kind === "say"){ out.push(`<div class="say${it.final ? " final" : ""}">${esc(it.text)}</div>`); continue; }
    const c = S.calls.get(it.id);
    const dec = !c.v ? "WAIT" : c.v.decision;
    const decTxt = !c.v ? (c.result ? "기록 없음" : "검증 중") : (dec === "REASON" && !c.final ? "추론 중" : dec);
    let res = "";
    if (c.confirm) res += `<span class="pill ${c.confirm.approve ? "PASS" : (isHeld(c.confirm) ? "CONFIRM" : "BLOCK")}">${confirmKo(c.confirm)}</span> `;
    const rp = c.result && c.result.replay;
    if (rp) res += `<span style="color:var(--muted)">${esc(rp)}</span>`;
    else if (c.executed === true) res += `<span style="color:var(--pass)">실행됨</span>`;
    else if (c.executed === false) res += `<span style="color:var(--block)">${S.start && S.start.replay ? "차단됨 (리플레이)" : "실행 중단 — 에이전트에 사유 반환"}</span>`;
    out.push(`<button class="call${S.sel === c.id ? " sel" : ""}" data-id="${esc(c.id)}">
      <span class="n">#${c.n}</span><span class="fn">${esc(c.name)}</span>
      <span class="pill ${dec}${dec === "REASON" && !c.final ? " thinking" : ""}">${esc(decTxt)}</span>
      <span class="args">${esc(short(c.args))}</span>${res ? `<span class="res">${res}</span>` : ""}</button>`);
  }
  if (S.end){
    const e = S.end, ob = (e.outbox || []).length, tr = (e.trash || []).length, sh = (e.shared || []).length;
    out.push(`<div class="end"><span><b>종료</b> ${esc(endKo(e.reason))}</span><span>발송 메일 <b class="mono">${ob}</b></span>
      <span>삭제 항목 <b class="mono">${tr}</b></span><span>공유 <b class="mono">${sh}</b></span>
      <span>호출 <b class="mono">${S.order.length}</b></span>${e.wall_s != null ? `<span>응답 시간 <b class="mono">${e.wall_s}s</b></span>` : ""}</div>`);
  }
  $("#stream").innerHTML = out.join("") || `<div class="empty">에이전트 실행 중…</div>`;
  $("#stream").querySelectorAll(".call").forEach(b => b.onclick = () => { S.sel = b.dataset.id; S.manual = true; render(); });
  const sel = $("#stream .call.sel"); if (sel && !S.manual) sel.scrollIntoView({block:"nearest"});
}
function isHeld(cf){ return /^mcp/.test(cf.by || "") || /^mcp:/.test(cf.note || ""); }
function confirmKo(cf){
  if (cf.approve) return "승인됨";
  if (isHeld(cf)) return /no human/.test(cf.note || "") ? "승인자 미연결로 보류" : "보류됨";
  return cf.by === "timeout" ? "시간 초과 → 거절됨" : "거절됨";
}
function endKo(r){
  if (!r) return "";
  const m = /^mcp session ended(?: · (\d+) call\(s\) refused)?/.exec(r);
  if (m) return "MCP 세션 종료" + (m[1] ? ` · 차단·보류된 호출 ${m[1]}건` : "");
  if (r === "answered") return "에이전트 작업 완료";
  if (r.startsWith("halted: declined")) return "거절됨 → 실행 중단";
  if (r.startsWith("halted: blocked")) return "문지기 차단 → 실행 중단 " + r.slice(15);
  if (r === "replay end") return "리플레이 종료";
  if (r === "step cap") return "최대 스텝 초과 (Max Steps)";
  return r;
}

function bar(room, p, ghost, ticks){
  const tk = ticks.map(x => `<span class="tk" style="left:${x*100}%"><i>${x}</i></span>`).join("");
  const g = ghost != null ? `<span class="ghost" style="left:calc(${ghost*100}% - 1px)" title="1차 판별값 ${ghost.toFixed(2)}"></span>` : "";
  return `<div class="bar"><span class="fill" style="width:${Math.max(0, Math.min(1, p))*100}%"></span>${g}${tk}</div>`;
}
function confirmWhy(v){
  const r = (v && v.rule) || "";
  if (/^company rule/.test(r)) return "사내 정책(금융·개인정보 사외 금지)에 매칭되었습니다";
  if (/^gate unreachable/.test(r)) return "검증 서버가 응답하지 않습니다";
  if (/cut\/timeout/.test(r)) return "심층 추론이 미완료 상태이며 복구 불가 작업입니다";
  return "복구 불가 작업이나 신뢰도가 부족합니다";
}
function renderCard(){
  const c = S.calls.get(S.sel);
  if (!c){ $("#card").innerHTML = `<div class="empty">${S.end ? "이 세션에는 툴 호출이 없었습니다." : "에이전트가 아직 툴을 호출하지 않았습니다."}</div>`; return; }
  const v = c.v;
  if (!v && c.result){ $("#card").innerHTML = `<div class="verdict"><div class="what">#${c.n} ${esc(c.name)}</div><div class="stamp WAIT">기록 없음</div></div><div class="empty">${esc(c.result.replay || "이 호출의 검증 기록이 없습니다.")}</div>`; return; }
  const thinking = v && !c.final && v.decision === "REASON";
  const dec = !v ? "WAIT" : (thinking ? "REASON" : v.decision);
  const p = v ? (v.reasoned || v.direct) : null;
  const d0 = v && v.reasoned ? v.direct : null;
  const hit = v && c.final ? ROOM_OF_RULE[v.rule] : null;
  const hitColor = {BLOCK:"var(--block)", CONFIRM:"var(--confirm)", PASS:"var(--pass)"}[dec] || "var(--muted)";
  const ms = (v && v.ms) || {};
  let tim = [];
  if (ms.direct != null) tim.push(`1차 판별 (Direct) <b>${(ms.direct/1000).toFixed(2)}초</b>`);
  if (thinking && S.reasonT[c.id]) tim.push(`심층 추론 <b class="thinking" id="rt">${((performance.now()-S.reasonT[c.id])/1000).toFixed(1)}초…</b>`);
  if (ms.reasoned != null) tim.push(`심층 추론 (Reasoning) <b>${(ms.reasoned/1000).toFixed(1)}초</b>` + (v.reasoning_tokens ? ` · ${v.reasoning_tokens}토큰` : "") + (v.cut ? ` · <span style="color:var(--block)">토큰 한도 초과 (Truncated)</span>` : ""));
  if (v && v.stage) tim.push(`단계 <b>${{direct:"1차 판별 (Direct)", reasoned:"추론 후 판정", human:"승인 요청", failsafe:"게이트 무응답"}[v.stage] || esc(v.stage)}</b>`);
  if (v && v.rule) tim.push(`매칭된 규칙 <b>${esc(v.rule)}</b>`);
  if (v && v.policy) tim.push(`정책 <b>${esc(v.policy)}</b>`);
  const rooms = [];
  if (p){
    const room = (key, label, q, val, ghost, ticks, extra) => rooms.push(
      `<div class="room${hit === key ? " hit" : ""}" style="${hit === key ? "color:" + hitColor : ""}">
        <div class="lab"><b>${label}</b><span>${q}</span></div>${extra || bar(key, val, ghost, ticks)}
        <div class="val">${extra && val == null ? "" : val.toFixed(2)}</div></div>`);
    room("match", "match", "요청 의도 일치도", p.match, d0 && d0.match, [0.2, 0.8]);
    if (p.injected_asked === false) room("injected", "injected", "인젝션 유래 여부", null, null, [], `<div class="na">평가 생략 (Skipped) — 이 세션에서 조회한 외부 컨텍스트 없음</div>`);
    else room("injected", "injected", "인젝션 유래 여부", p.injected, d0 && d0.injected, [0.2, 0.5, 0.8]);
    room("undo", "undo", "복구 가능 여부", p.undo, d0 && d0.undo, [0.8]);
    let gx;
    if (p.grade_source === "code") gx = `<div class="na">툴 권한표로 자동 분류 → <b class="mono" style="color:var(--ink)">${esc(p.grade)}</b> · 모델 질의 생략</div>`;
    else {
      const gp = p.grade_p || {};
      gx = `<div class="grade">${["read","modify","send","delete"].map(k => `<div class="g-${k}" style="flex-grow:${Math.max(0.0001, gp[k] || 0)}">${(gp[k] || 0) > 0.12 ? k : ""}</div>`).join("")}</div>`;
    }
    rooms.push(`<div class="room${hit === "grade" ? " hit" : ""}" style="${hit === "grade" ? "color:" + hitColor : ""}">
      <div class="lab"><b>grade</b><span>작업 유형</span></div>${gx}<div class="val" style="font-size:14px">${esc(p.grade)}</div></div>`);
    for (const r of (v.rules || [])){
      const h = r.hit && /^company rule/.test(v.rule || "");
      rooms.push(`<div class="room rule${h ? " hit" : ""}" style="${h ? "color:var(--confirm)" : ""}">
        <div class="lab"><b>rule_${esc(r.id)}</b><span>사내 정책: ${esc(r.text)}</span></div>${bar("rule", r.p, null, [r.threshold])}
        <div class="val">${r.p.toFixed(2)}</div></div>`);
    }
  }
  if (!p && v && v.gate_down) rooms.push(`<div class="na">검증 서버가 응답하지 않습니다 — 확률 없이 코드가 결정 (Fail-Closed). 읽기 전용 툴만 통과, 나머지는 보류</div>`);
  const waitingHere = S.live && S.waiting === c.id;
  let ln = 0;
  const policyRows = POLICY_LINES.filter(l => !l.show || l.show(v)).map(l => {
    const on = v && (v.rule === l.rule || (l.alt && v.rule === l.alt));
    ln++;
    return `<div class="ln${on ? " on" : ""}"><span class="no">${ln}</span><span>${esc(l.code)}</span><span class="out pill ${l.out}">${l.out}</span></div>`;
  }).join("");
  const reasonTxt = v && v.reasoning ? `<details class="reasontxt"><summary>추론 로그 (CoT / Thinking) 보기 (${v.answers_source || ""})</summary><pre>${esc(v.reasoning)}</pre></details>` : "";
  tim = tim.map(x => `<span>${x}</span>`);
  $("#card").innerHTML = `
    <div class="verdict">
      <div class="what">#${c.n} ${esc(c.name)}</div>
      <div class="stamp ${dec}${thinking ? " thinking" : ""}">${thinking ? "추론 중" : esc(dec)}<small>${esc(DEC_KO[dec] || "")}</small></div>
      <div class="argsfull">${esc(JSON.stringify(c.args, null, 1))}</div>
    </div>
    <div class="timing">${tim.join("")}</div>
    <div class="confirm${waitingHere ? " on" : ""}" id="confirmbox">
      <span class="msg">${esc(confirmWhy(v))} — 승인이 필요합니다 <span class="mono" id="cd"></span></span>
      <button class="yes" id="yes">승인 (Y)</button><button class="no" id="no">거절 (N)</button>
    </div>
    <div class="rooms">${rooms.join("")}</div>
    <div class="policy"><div class="hdr">결정론적 정책 코드 — 동일 점수이면 언제나 동일 판정 (${esc(v ? v.policy_version || "" : "")})</div>${policyRows}</div>
    ${reasonTxt}`;
  if (waitingHere){ $("#yes").onclick = () => answer(true); $("#no").onclick = () => answer(false); }
}
function render(){ if (!S) return; renderLeft(); renderCard(); }

// 추론 타이머·사람 확인 카운트다운만 0.1초마다 갱신
setInterval(() => {
  if (!S) return;
  const c = S.calls.get(S.sel);
  const rt = $("#rt");
  if (rt && c && S.reasonT[c.id]) rt.textContent = ((performance.now() - S.reasonT[c.id]) / 1000).toFixed(1) + "초…";
  const cd = $("#cd");
  if (cd && S.waiting) cd.textContent = Math.max(0, Math.round((S.waitS || 90) - (performance.now() - S.waitT) / 1000)) + "초";
}, 100);

async function answer(approve){
  if (!S || !S.live || !S.waiting) return;
  try { await api("/worker/confirm", {run:S.rid, approve}); } catch (e) { console.warn(e); }
}

// ---------- 라이브 ----------
async function startLive(scene){
  const my = ++token;
  const body = {scene};
  if ($("#policy").value) body.policy = $("#policy").value;
  if ($("#rule-pii").checked) body.rules = ["pii"];
  let run_id;
  try { ({run_id} = await api("/worker/run", body)); }
  catch (e) {
    const busy = / 429$/.test(e.message);
    $("#stream").innerHTML = `<div class="empty">${busy ? "동시 실행 한도 초과 (최대 2건) — 잠시 후 다시 시도해 주세요. 저장된 세션 리플레이는 바로 가능합니다." : "라이브 실행을 시작하지 못했습니다 — " + esc(e.message) + " · 저장된 세션 리플레이는 가능합니다."}</div>`;
    $("#task").hidden = true; $("#card").innerHTML = `<div class="empty">툴 호출이 들어오면 여기서 판별합니다.</div>`;
    S = null; return;
  }
  S = newState(run_id, true); render();
  let since = 0;
  while (my === token){
    let d;
    try { d = await api(`/worker/events?run=${encodeURIComponent(run_id)}&since=${since}`); }
    catch (e) { await sleep(800); continue; }
    for (const ev of d.events){ since++; apply(ev); }
    if (d.events.length) render();
    if (d.done && !d.events.length) break;
    await sleep(250);
  }
  refreshRuns();
}

// ---------- 재생 ----------
async function startReplay(rid){
  const my = ++token;
  const d = await api(`/worker/events?run=${encodeURIComponent(rid)}&since=0`);
  S = newState(rid, false); render();
  const real = $("#speed").value === "real", fast = $("#speed").value === "fast";
  let prev = null;
  for (const ev of d.events){
    if (my !== token) return;
    if (prev != null){
      let gap = Math.max(0, (ev.t - prev) * 1000);
      if (!real){
        if (gap > 2500){ S.compressed++; gap = 1800; }   // 일꾼 생성·추론 기다림은 줄인다(실제 값은 카드의 ms에 그대로)
      }
      if (fast && gap > 900){ S.compressed++; gap = 900; }
      gap = Math.max(gap, ev.type === "tool_call" ? (fast ? 230 : 420) : (ev.type === "verdict" ? (fast ? 140 : 260) : 40));   // 같은 시각에 찍힌 기록도 눈으로 따라가게
      if (S.skip) gap = 0;
      if (ev.type === "verdict" && ev.final && S.reasonT[ev.call_id] && !real && !S.skip) gap = Math.max(gap, fast ? 900 : 1400);
      await sleep(gap);
    }
    if (ev.type === "reasoning") S.reasonT[ev.call_id] = performance.now();
    apply(ev); if (!S.skip) render();
    prev = ev.t;
  }
  render();
}

async function holdReplay(rid){
  HOLD = rid;
  let st = {};
  try { const d = await api(`/worker/events?run=${encodeURIComponent(rid)}&since=0`); st = (d.events || []).find(e => e.type === "run_start") || {}; }
  catch (e) { $("#stream").innerHTML = `<div class="empty">저장된 세션 ${esc(rid)}을 찾지 못했습니다.</div>`; HOLD = null; return; }
  $("#stream").innerHTML = `<div class="empty">리플레이 준비됨 — 「${esc(st.task || rid)}」 · ${esc(st.title || "")}<br><b>Space</b> 또는 <b>Enter</b>를 누르면 재생합니다</div>`;
}

// ---------- 시나리오·목록·상태 ----------
async function loadScenes(){
  try {
    const sc = await api("/worker/scenes");
    const box = $("#scenes"); let i = 0;
    for (const [id, s] of Object.entries(sc)){
      i++;
      const b = document.createElement("button");
      b.className = "scene"; b.dataset.kind = s.kind || ""; b.dataset.scene = id; b.title = s.title || id;
      b.textContent = id;
      b.onclick = () => startLive(id);
      box.appendChild(b);
    }
  } catch (e) { $("#scenes").insertAdjacentHTML("beforeend", `<span class="chip">시나리오 목록을 받지 못했습니다</span>`); }
}
async function refreshRuns(){
  try {
    const runs = await api("/worker/runs");
    const sel = $("#replay"); const cur = sel.value;
    sel.innerHTML = `<option value="">저장된 세션 선택…</option>` + runs.map(r =>
      `<option value="${esc(r.run_id)}">${esc(r.run_id)} — ${esc(endKo(r.end) || "")}</option>`).join("");
    sel.value = cur;
  } catch (e) {}
}
async function health(){
  const h = $("#health");
  try {
    const d = await api("/health");
    const ps = $("#policy");
    if (!ps.options.length && d.policy_versions){
      const lab = {v1:"v1 베이스라인", v2:"v2 정적 툴 권한표", v3:"v3 = v2 + 추론 타임아웃/잘림 대비", v3b:"v3b 추론 후 undo는 1차 판별값 유지", v3c:"v3c 빠른 모드 (외부 전송·삭제 경계 시 즉시 승인 요청)"};
      ps.innerHTML = Object.keys(d.policy_versions).map(k => `<option value="${esc(k)}">${esc(lab[k] || k)}</option>`).join("");
      ps.value = d.policy;
    }
    h.innerHTML = `<span class="dot ${d.ok ? "ok" : "bad"}"></span>${d.ok ? "실시간 검증 가능" : "저장된 시연으로 실행"} · 정책 ${esc(d.policy)} <span class="mono">${esc(d.policy_version)}</span>`;
  } catch (e) { h.innerHTML = `<span class="dot bad"></span>서버 연결 끊김 · 저장된 시연만 가능`; }
}
$("#replay").onchange = e => { e.target.blur(); if (e.target.value) startReplay(e.target.value); };
// 셀렉트·체크박스를 마우스로 고른 뒤에도 키보드(1~5 · Y/N · E · Space)가 바로 먹게 포커스를 푼다
for (const id of ["#speed", "#policy", "#rule-pii"]) $(id).addEventListener("change", e => e.target.blur());
$("#skip").onclick = () => { if (S && !S.live) S.skip = true; };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || (e.target.tagName === "INPUT" && e.target.type !== "checkbox") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (HOLD && (e.key === " " || e.key === "Enter")){ e.preventDefault(); const r = HOLD; HOLD = null; startReplay(r); return; }
  if (/^[1-9]$/.test(e.key)){ const b = document.querySelectorAll("#scenes .scene")[+e.key - 1]; if (b) b.click(); }
  if (e.key === "y" || e.key === "Y") answer(true);
  if (e.key === "n" || e.key === "N") answer(false);
  if (e.key === "e" || e.key === "E") $("#skip").click();
});
const qs = new URLSearchParams(location.search);
loadScenes(); refreshRuns(); health(); setInterval(health, 10000);
if (qs.get("speed")) $("#speed").value = qs.get("speed");
if (qs.get("replay")) (qs.get("hold") ? holdReplay : startReplay)(qs.get("replay"));
</script>
